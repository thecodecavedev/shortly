<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=content_copy" />
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <title>short.ly</title>
</head>

<body>

    <section class="main-body">
        <div class="nav-bar">
            <h1 class="logo">short.ly</h1>
        </div>
        <div class="main-section">
            <div class="main-section-top">
                <h1>Shorten your <span class="long-text">long</span> link</h1>
            </div>
            <div class="main-section-mid">
                <form id="form">
                    <input type="text" name="url" id="url">
                    <button type="submit" class="shorten-submit">shorten</button>
                </form>
            </div>
            <div class="main-section-bottom">
                <div class="link-card" id="link-card">

                    <p id="shortly">http://127.0.0.1:5000/</p>
                    <button id="copy_button"><span class="material-symbols-outlined">
                            content_copy
                        </span> Copy</button>

                </div>
            </div>
        </div>
    </section>
    <div class="short_url">

    </div>
</body>
<script src="{{url_for('static', filename='app.js')}}"></script>

</html>
